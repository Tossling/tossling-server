name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - run: make vet test build smoke
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: make browser

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t tossling-server .
      - name: Run the image
        run: |
          docker run -d --name tossling -p 18090:8090 -e TOSSLING_BASE_URL=http://127.0.0.1:18090 tossling-server
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:18090/v1/tossling/health && break; sleep 0.2; done
          docker exec tossling cat /data/tossling-server.json > settings.json
      - run: tests/smoke.sh http://127.0.0.1:18090 settings.json
        env:
          TOSSLING_CLI: docker exec tossling tossling-server
      - name: New setup link
        run: test "$(curl -s -o /dev/null -w '%{http_code}' "$(docker exec tossling tossling-server setup-link)")" = 200
      - name: The server runs as 10001 and owns its data
        run: |
          docker exec tossling grep -qE '^Uid:[[:space:]]+10001[[:space:]]' /proc/1/status
          test "$(docker exec tossling stat -c %u:%g /data/user.db)" = 10001:10001
          test "$(docker exec tossling find /data ! -user 10001 | wc -l)" = 0
      - name: Data written as root by an older image
        run: |
          docker volume create old-data
          docker run --rm -v old-data:/data alpine:3 sh -c 'echo old > /data/written-by-root && chmod 600 /data/written-by-root'
          docker run -d --name tossling-old -p 18092:8090 -v old-data:/data -e TOSSLING_BASE_URL=http://127.0.0.1:18092 tossling-server
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:18092/v1/tossling/health && break; sleep 0.2; done
          curl -sf http://127.0.0.1:18092/v1/tossling/health
          test "$(docker exec tossling-old stat -c %u /data/written-by-root)" = 10001
          docker exec tossling-old tossling-server project add upgraded Upgraded > /dev/null
          test "$(docker exec tossling-old find /data ! -user 10001 | wc -l)" = 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: The arm64 image
        run: |
          docker buildx build --platform linux/arm64 --cache-from type=gha --cache-to type=gha,mode=max --load -t tossling-server:arm64 .
          docker run -d --name tossling-arm64 --platform linux/arm64 -p 18091:8090 -e TOSSLING_BASE_URL=http://127.0.0.1:18091 tossling-server:arm64
          docker exec tossling-arm64 uname -m | grep -qx aarch64
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:18091/v1/tossling/health && exit 0; sleep 0.2; done
          docker logs tossling-arm64; exit 1
      - if: failure()
        run: docker logs tossling
      - name: Save the image
        run: docker save tossling-server | gzip > tossling-server-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tossling-server-image
          path: tossling-server-image.tar.gz
          retention-days: 14
