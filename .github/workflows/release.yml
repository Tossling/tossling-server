name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/tossling/tossling-server:${{ github.ref_name }}
            ghcr.io/tossling/tossling-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/tossling/tossling-server
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Tossling Server ${GITHUB_REF_NAME#v}" --notes "Docker image: \`ghcr.io/tossling/tossling-server:${GITHUB_REF_NAME}\` (linux/amd64, linux/arm64). See the README for setup."
