name: Release

# Runs on the home runner. Only tag pushes may use the home label: ci.yml runs
# pull requests from forks and stays on ubuntu-latest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: [self-hosted, home]
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: The tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      # The runner keeps its home between jobs, so the registry login and buildx
      # state live in this job's temp directory, which the runner deletes after
      # the job.
      - name: Docker config for this job
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      # The VM registers qemu for arm64 itself (qemu-user-static, flag F), so the
      # job does not run setup-qemu-action and rewrite binfmt for the whole VM.
      - name: arm64 emulation
        run: grep -qx enabled /proc/sys/fs/binfmt_misc/qemu-aarch64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/tossling/tossling-server:${{ github.ref_name }}
            ghcr.io/tossling/tossling-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/tossling/tossling-server
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Docker logout
        if: always()
        run: |
          docker logout ghcr.io || true
          rm -f "$DOCKER_CONFIG/config.json"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Tossling Server ${GITHUB_REF_NAME#v}" --notes "Docker image: \`ghcr.io/tossling/tossling-server:${GITHUB_REF_NAME}\` (linux/amd64, linux/arm64). See the README for setup."

  # Waits for approval in the production environment, then asks VM 105 to run the
  # new image. The key in DEPLOY_SSH_KEY can only start the deploy script there.
  deploy:
    needs: image
    runs-on: [self-hosted, home]
    environment: production
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions: {}
    steps:
      - name: Deploy on the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          umask 077
          dir=$(mktemp -d "$RUNNER_TEMP/deploy.XXXXXX")
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$dir/known_hosts"
          echo "$GITHUB_REF_NAME $DIGEST" | ssh -T \
            -i "$dir/key" -o IdentitiesOnly=yes -o IdentityAgent=none \
            -o UserKnownHostsFile="$dir/known_hosts" -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "deploy@$DEPLOY_HOST"
